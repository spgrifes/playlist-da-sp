<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Playlist da SP</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0b0b0b;color:#fff;font-family:-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding-bottom:120px}
header{text-align:center;padding:28px 16px 12px}
header img{height:84px}
h2{max-width:640px;margin:22px auto 4px;padding:0 16px;font-size:18px;color:#d4af37}
h2 small{display:block;color:#999;font-size:13px;font-weight:400}
h1{font-size:28px;margin-top:10px;letter-spacing:.5px}
header p{color:#999;font-size:14px;margin-top:4px}
.list{max-width:640px;margin:12px auto;padding:0 12px}
.t{display:flex;align-items:center;gap:14px;background:#161616;border-radius:14px;padding:10px;margin-bottom:10px;cursor:pointer;border:2px solid transparent}
.t.on{border-color:#d4af37;background:#1d1a10}
.t img{width:72px;height:72px;border-radius:10px;object-fit:cover}
.t .i{flex:1;min-width:0}
.t b{display:block;font-size:17px}
.t span{color:#999;font-size:13px}
.t .p{width:44px;height:44px;border-radius:50%;background:#d4af37;color:#000;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.b{margin-top:8px;display:flex;gap:8px}.b button{border:0;border-radius:8px;padding:8px 14px;font-size:14px;font-weight:600}.b .ok{background:#2e9e4f;color:#fff}.b .no{background:#3a3a3a;color:#ddd}
.bar{position:fixed;left:0;right:0;bottom:0;background:#111;border-top:1px solid #2a2a2a;padding:10px 14px}
.bar .n{font-size:14px;margin-bottom:6px;text-align:center;color:#d4af37}
audio{width:100%;height:40px}
</style>
</head>
<body>
<header>
<img src="logo-branca.png" alt="SP Grifes">
<h1>Playlist da SP</h1>
<p>Toque numa música para ouvir. Ao terminar, toca a próxima.</p>
</header>
<h2>Aprovadas<small>Só entra aqui a música que você aprovar.</small></h2>
<div class="list" id="list"></div>
<h2>Para você ouvir e aprovar<small>Toque em Aprovar ou Reprovar em cada música.</small></h2>
<div class="list" id="list2"></div>
<div class="bar"><div class="n" id="now">Escolha uma música</div><audio id="au" controls></audio></div>
<script>
var SB='https://cuiqmczhtcrrxafmzmhh.supabase.co/rest/v1/playlist_votos',KEY='sb_publishable_2A36EPYGbgAXMOPj0Up6yg_IxSsYmak';
var H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
var M=[
{k:"black-friday-no-bras",n:"Black Friday no Brás",s:"Eletrônica / House",a:"audio/black-friday-no-bras.mp3",c:"capas/black-friday-no-bras.jpg",v:"aprovado"},
{k:"o-lobo-elegante",n:"Martino Lorenzo - O Lobo Elegante",s:"Versão A",a:"audio/o-lobo-elegante.mp3",c:"capas/o-lobo-elegante.jpg",v:"pendente"},
{k:"natal-no-bras",n:"Natal no Brás",s:"Pagode / pop festivo",a:"audio/natal-no-bras.mp3",c:"capas/natal-no-bras.jpg",v:"pendente"},
{k:"festa-na-sp-grifes",n:"Festa na SP Grifes",s:"Samba-rock e axé",a:"audio/festa-na-sp-grifes.mp3",c:"capas/festa-na-sp-grifes.jpg",v:"pendente"},
{k:"o-lobo-elegante-b",n:"Martino Lorenzo - O Lobo Elegante",s:"Versão B",a:"audio/o-lobo-elegante-b.mp3",c:"capas/o-lobo-elegante.jpg",v:"pendente"},
{k:"black-friday-no-site",n:"Black Friday no Site",s:"Black Friday",a:"audio/black-friday-no-site.mp3",c:"capas/black-friday-no-bras.jpg",v:"pendente"},
{k:"o-bras-vigia-a",n:"O Brás Vigia",s:"Versão A",a:"audio/o-bras-vigia-a.mp3",c:"capas/festa-na-sp-grifes.jpg",v:"pendente"},
{k:"o-bras-vigia-b",n:"O Brás Vigia",s:"Versão B",a:"audio/o-bras-vigia-b.mp3",c:"capas/festa-na-sp-grifes.jpg",v:"pendente"}
];
var au=document.getElementById('au'),now=document.getElementById('now'),L=document.getElementById('list'),L2=document.getElementById('list2'),cur=-1;
function voto(m,v){m.v=v;render();fetch(SB,{method:'POST',headers:Object.assign({Prefer:'resolution=merge-duplicates'},H),body:JSON.stringify({slug:m.k,voto:v,atualizado:new Date().toISOString()})}).catch(function(){})}
function render(){L.innerHTML='';L2.innerHTML='';M.forEach(function(m,i){if(m.v==='reprovado')return;var d=document.createElement('div');d.className='t'+(i===cur?' on':'');
var b=m.v==='pendente'?'<div class="b"><button class="ok">Aprovar</button><button class="no">Reprovar</button></div>':'<div class="b"><button class="no">Tirar</button></div>';
d.innerHTML='<img src="'+m.c+'" alt=""><div class="i"><b>'+m.n+'</b><span>'+m.s+'</span>'+b+'</div><div class="p">&#9654;</div>';
d.onclick=function(){play(i)};
d.querySelectorAll('button').forEach(function(x){x.onclick=function(e){e.stopPropagation();voto(m,x.className==='ok'?'aprovado':'reprovado')}});
(m.v==='aprovado'?L:L2).appendChild(d)});
if(!L2.children.length)L2.innerHTML='<p style="color:#777;text-align:center;font-size:14px">Nenhuma música esperando aprovação.</p>'}
function play(i){cur=i;au.src=M[i].a;au.play();now.textContent=M[i].n;render()}
au.onended=function(){var n=cur+1;while(n<M.length&&M[n].v==='reprovado')n++;if(n<M.length)play(n)};
render();
fetch(SB+'?select=slug,voto',{headers:H}).then(function(r){return r.json()}).then(function(rs){rs.forEach(function(r){M.forEach(function(m){if(m.k===r.slug)m.v=r.voto})});render()}).catch(function(){});
</script>
</body>
</html>
